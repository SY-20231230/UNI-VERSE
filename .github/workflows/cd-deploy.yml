name: CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: universe-cluster

jobs:
  deploy:
    name: Build, push, and deploy to ECS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --platform linux/amd64 --target production \
            -t "$ECR_REGISTRY/universe-frontend:latest" \
            -t "$ECR_REGISTRY/universe-frontend:${{ github.sha }}" \
            frontend
          docker push "$ECR_REGISTRY/universe-frontend:latest"
          docker push "$ECR_REGISTRY/universe-frontend:${{ github.sha }}"

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            -t "$ECR_REGISTRY/universe-backend:latest" \
            -t "$ECR_REGISTRY/universe-backend:${{ github.sha }}" \
            backend
          docker push "$ECR_REGISTRY/universe-backend:latest"
          docker push "$ECR_REGISTRY/universe-backend:${{ github.sha }}"

      - name: Build and push AI server image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            -t "$ECR_REGISTRY/universe-ai:latest" \
            -t "$ECR_REGISTRY/universe-ai:${{ github.sha }}" \
            ai-server
          docker push "$ECR_REGISTRY/universe-ai:latest"
          docker push "$ECR_REGISTRY/universe-ai:${{ github.sha }}"

      - name: Force new ECS deployments
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service frontend-service --force-new-deployment --region "$AWS_REGION"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service backend-service --force-new-deployment --region "$AWS_REGION"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service ai-service --force-new-deployment --region "$AWS_REGION"

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services frontend-service backend-service ai-service \
            --region "$AWS_REGION"
